<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1d2026" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M4 26V10l12-6 12 6v16z' fill='%23ff7a1a'/%3E%3Crect x='13' y='16' width='6' height='10' fill='%231d2026'/%3E%3C/svg%3E" />
    <title>Room Studio</title>
  </head>
  <body>
    <canvas id="c" aria-label="3D room editor"></canvas>

    <header id="topbar">
      <div class="brand">Room Studio</div>
      <nav id="room-tabs" aria-label="Rooms"></nav>
      <div class="top-actions">
        <button id="btn-cutaway" type="button" class="toggle" title="Fade walls between you and the room">See-through</button>
        <button id="btn-new" type="button">New</button>
        <button id="btn-open" type="button">Open</button>
        <button id="btn-save" type="button">Save</button>
        <button id="btn-fullscreen" type="button" title="Fullscreen" aria-label="Fullscreen">⛶</button>
      </div>
    </header>

    <div id="hint" hidden></div>

    <aside id="left" class="panel">
      <section id="sec-library" data-m="add"><h2>Add</h2><div id="library"></div></section>
      <section id="sec-room" data-m="room"></section>
    </aside>
    <aside id="right" class="panel">
      <section id="sec-props" data-m="edit"></section>
    </aside>

    <nav id="mtabs" aria-label="Panels">
      <button type="button" data-tab="room">Room</button>
      <button type="button" data-tab="add">Add</button>
      <button type="button" data-tab="edit">Edit</button>
      <button type="button" id="btn-drawer" aria-label="Show or hide panel">☰</button>
    </nav>

    <div id="toast" role="status" aria-live="polite"></div>
    <input type="file" id="file-open" accept=".json,application/json" hidden />
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
